<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Notre Famille Guillaume</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,"Segoe UI",sans-serif;color:#174335}
main{min-height:100dvh;background:radial-gradient(circle at 50% 27%,#ffefb7 0%,#ffe6b7 16%,#a7e7c1 36%,#1c9474 64%,#064338 100%);overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between}
header{color:white;text-shadow:0 2px 8px #00442b88;text-align:center;padding:46px 18px 7px;position:relative;z-index:2}
header strong{display:block;font-size:clamp(20px,6vw,29px);font-weight:950;letter-spacing:.02em}header small{font-size:12px;font-weight:700}
.scenery{position:relative;text-align:center;margin:auto 0;min-height:160px;display:grid;place-items:center;filter:drop-shadow(0 8px 12px #003a2e77)}
#illustration{font-size:clamp(96px,30vw,166px);white-space:nowrap;animation:float 3.3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.floral{position:absolute;font-size:34px;opacity:.85}.topLeft{top:20%;left:4%}.topRight{top:22%;right:4%}.bottomLeft{bottom:29%;left:4%}.bottomRight{bottom:27%;right:6%}
article{position:relative;z-index:3;margin:8px 18px 26px;padding:21px;border-radius:30px;background:#fffbeaef;border:2px solid #f0c65a;box-shadow:0 18px 35px #06352855;text-align:center}
.kicker{font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;color:#0c7954}h1{font-size:clamp(26px,7.5vw,36px);letter-spacing:-.04em;line-height:1.13;margin:9px 0 13px;color:#064d36}
p{font-size:15px;line-height:1.5;color:#416f5a;min-height:65px;margin:0 0 15px}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:20px}.dots i{height:8px;width:8px;background:#bad4bf;border-radius:20px}.dots i.on{width:27px;background:#e5ad40}
.actions{display:flex;gap:9px}.actions button{border:0;border-radius:17px;padding:16px 10px;font-size:15px;font-weight:850}
#skip{background:#e5e6d7;flex:0 0 85px;color:#34614b}#next{background:#0a7151;flex:1;color:#fff}
@media(max-height:650px){header{padding:20px 18px 0}.scenery{min-height:80px}#illustration{font-size:73px}article{padding:14px;margin-bottom:10px}p{min-height:0;margin-bottom:7px}}
</style></head><body>
<main>
<div class="floral topLeft">🌿</div><div class="floral topRight">🌸</div><div class="floral bottomLeft">🌺</div><div class="floral bottomRight">🌱</div>
<header><strong>✦ Notre Famille Guillaume ✦</strong><small>Foi • Unité • Progrès</small></header>
<div class="scenery"><div id="illustration">📖🌺</div></div>
<article><div class="kicker" id="kicker">01 • Bienvenue</div><h1 id="heading">Grandissons ensemble dans la foi</h1>
<p id="description">Un espace pour Guillaume, Vanessa et Kem’lyn : lecture, culte familial et pensées bibliques.</p>
<div class="dots"><i class="on"></i><i></i><i></i></div>
<div class="actions"><button id="skip">Passer</button><button id="next">Suivant ❯</button></div>
</article></main>
<script>
(function(){
var SITE='https://script.google.com/macros/s/AKfycby4lvl5sQPHuik14KFc3GNWv6zx6qu5exzndgyybti8E1ju5In1vqTC478HlxN0oh8rzw/exec';
var pages=[
['01 • Bienvenue','Grandissons ensemble dans la foi','Un espace pour Guillaume, Vanessa et Kem’lyn : lecture, culte familial et pensées bibliques.','📖🌺'],
['02 • Nos rendez-vous','Préparons nos réunions','Jeudi 18 h 45 et samedi 16 h : nos réunions, études et projets en famille.','📅✨'],
['03 • Nos progrès','Chaque pas mérite une étoile','100 points par réponse et des avatars qui progressent vers 1 000 points dans le mois.','🏆🌟']
], i=0;
function show(){
document.getElementById('kicker').textContent=pages[i][0];
document.getElementById('heading').textContent=pages[i][1];
document.getElementById('description').textContent=pages[i][2];
document.getElementById('illustration').textContent=pages[i][3];
document.getElementById('next').textContent=i===2?'Entrer dans notre espace ✓':'Suivant ❯';
document.querySelectorAll('.dots i').forEach(function(el,n){el.classList.toggle('on',n===i)});
}
function enter(){location.href=SITE}
document.getElementById('next').onclick=function(){if(i===2)enter();else{++i;show()}};
document.getElementById('skip').onclick=enter;
var startX=0;
addEventListener('touchstart',function(e){startX=e.changedTouches[0].clientX},{passive:true});
addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>65){i=Math.max(0,Math.min(2,i+(d<0?1:-1)));show()}},{passive:true});
})();
</script></body></html>
