name: Compiler KVG Master V48.1 captures et historique
on:
  push:
    branches: [kvg-master-v48-1-historique-captures-20261115]
    paths:
      - 'kvg-master-v48/**'
      - '.github/workflows/kvg-master-v48-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer le SDK Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK V48.1 release et debug
        run: gradle --no-daemon --stacktrace --project-dir kvg-master-v48 :app:assembleRelease :app:assembleDebug
      - name: Préparer l'APK à signer localement
        shell: bash
        run: |
          mkdir -p kvg-v48-1-build
          cp kvg-master-v48/app/build/outputs/apk/release/app-release-unsigned.apk kvg-v48-1-build/KVG_Master_V48_1_unsigned.apk
          cp kvg-master-v48/app/build/outputs/apk/debug/app-debug.apk kvg-v48-1-build/KVG_Master_V48_1_debug.apk
          printf '%s\n' 'L APK release est non signe. Signer uniquement hors GitHub avec le certificat KVG Master original.' > kvg-v48-1-build/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KVG-Master-V48-1-APK
          path: kvg-v48-1-build/
          if-no-files-found: error
          retention-days: 30
