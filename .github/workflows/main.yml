name: Compiler APK Android KVG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compiler APK installable
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer les fichiers du projet
        uses: actions/checkout@v4

      - name: Verifier la presence du projet Android
        shell: bash
        run: |
          if [ ! -f settings.gradle ] || [ ! -f app/build.gradle ]; then
            echo "::error::Projet Android incomplet : il faut settings.gradle et app/build.gradle a la racine du depot."
            exit 1
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Le SDK Android est deja present sur ubuntu-latest.
      # Ne pas utiliser android-actions/setup-android@v3 :
      # sa tentative d'installation du paquet obsolete "tools" echoue.
      - name: Verifier Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          command -v sdkmanager
          sdkmanager --version

      - name: Accepter les licences Android SDK
        shell: bash
        run: |
          sdkmanager --licenses < <(yes)

      - name: Installer Android SDK 35
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler l'application
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verifier le fichier APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Mettre l'APK en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: KVG-La-Rentree-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
