name: Compiler APK Android KVG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler APK installable
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Reparer automatiquement le projet Android
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          import struct
          import re

          root = Path.cwd()
          app = root / 'app'
          app.mkdir(exist_ok=True)

          # Corrige le depot KVG-Master qui contient des fichiers Android
          # directement a la racine, sans dossier app/.
          (root / 'settings.gradle').write_text('''pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'LaRentreeMonDeo'
          include ':app'
          ''', encoding='utf-8')

          (root / 'build.gradle').write_text('''plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ''', encoding='utf-8')

          (app / 'build.gradle').write_text('''plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.laboratoirekvg.larentree'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.laboratoirekvg.larentree'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ''', encoding='utf-8')

          (root / 'gradle.properties').write_text('''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          ''', encoding='utf-8')

          # Copie les vrais fichiers du depot, sans inventer leur contenu.
          files = {
              'MainActivity.java': 'app/src/main/java/com/laboratoirekvg/larentree/MainActivity.java',
              'AndroidManifest.xml': 'app/src/main/AndroidManifest.xml',
              'activity_main.xml': 'app/src/main/res/layout/activity_main.xml',
              'strings.xml': 'app/src/main/res/values/strings.xml',
              'styles.xml': 'app/src/main/res/values/styles.xml',
              'colors.xml': 'app/src/main/res/values/colors.xml',
              'ic_launcher.xml': 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
              'ic_launcher_round.xml': 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml',
              'ic_launcher_foreground.png': 'app/src/main/res/drawable-nodpi/ic_launcher_foreground.png',
          }
          for source_name, rel_path in files.items():
              target = root / rel_path
              if target.is_file():
                  continue
              source = root / source_name
              if source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  print('RANGE :', source_name, '->', rel_path)
              else:
                  print('INTROUVABLE :', source_name)

          # GitHub a renomme certains PNG en ic_launcher (1).png, etc.
          # Leur taille permet de retrouver automatiquement leur densite.
          densities = {48:'mdpi',72:'hdpi',96:'xhdpi',144:'xxhdpi',192:'xxxhdpi'}
          pattern = re.compile(r'^ic_launcher(?:_round)?(?: \(\d+\))?\.png$')
          for source in root.iterdir():
              if not source.is_file() or not pattern.fullmatch(source.name):
                  continue
              data = source.read_bytes()[:24]
              if len(data) != 24 or data[:8] != b'\x89PNG\r\n\x1a\n':
                  continue
              width, height = struct.unpack('>II', data[16:24])
              if width != height or width not in densities:
                  continue
              basename = 'ic_launcher_round.png' if source.name.startswith('ic_launcher_round') else 'ic_launcher.png'
              target = root / 'app/src/main/res' / ('mipmap-' + densities[width]) / basename
              if not target.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  print('ICONE :', source.name, '->', target.relative_to(root))

          mandatory = [
              'settings.gradle', 'build.gradle', 'app/build.gradle',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/laboratoirekvg/larentree/MainActivity.java',
              'app/src/main/res/layout/activity_main.xml',
              'app/src/main/res/values/strings.xml',
              'app/src/main/res/values/styles.xml',
              'app/src/main/res/values/colors.xml',
              'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
              'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml',
              'app/src/main/res/drawable-nodpi/ic_launcher_foreground.png',
          ]
          for name in ['ic_launcher.png', 'ic_launcher_round.png']:
              for density in densities.values():
                  mandatory.append(f'app/src/main/res/mipmap-{density}/{name}')
          missing = [p for p in mandatory if not (root / p).is_file()]
          if missing:
              raise RuntimeError('Fichiers Android introuvables :\n' + '\n'.join(missing))
          print('Projet Android reconstitue et verifie avec succes.')
          PYTHON

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          # Le SDK est installe sur les runners GitHub, mais sdkmanager
          # n'est pas necessairement dans la variable PATH.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm /111 -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager est introuvable dans $SDK_ROOT."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDK Manager : $SDKMANAGER"
          "$SDKMANAGER" --version

          # Eviter le faux echec 'Broken pipe' de la commande yes,
          # tout en verifiant le veritable code retour de sdkmanager.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "::error::Impossible d'accepter les licences Android SDK."
            exit "$SDK_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' 'build-tools;35.0.0'

      - name: Compiler l APK Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verifier l APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: KVG-La-Rentree-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
