
name: Compiler APK Android KVG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verifier le fichier APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: KVG-La-Rentree-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
