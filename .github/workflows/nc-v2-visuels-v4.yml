name: NumerikCloud INF - V2 compatible visuels V4
on:
  push:
    branches: [numerikcloud-inf-v2-visuels-v4]
    paths:
      - 'numerikcloud-infirmiere/**'
      - '.github/workflows/nc-v2-visuels-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restaurer le logo original NumerikCloud
        shell: bash
        run: |
          set -e
          mkdir -p numerikcloud-infirmiere/app/src/main/res/drawable
          base64 --decode numerikcloud-infirmiere/assets/logo.b64 > numerikcloud-infirmiere/app/src/main/res/drawable/logo_numerikcloud.jpg
      - name: Construire la version originale V2 + visuels V4
        working-directory: numerikcloud-infirmiere
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Sauvegarder le premier APK
        run: |
          set -e
          mkdir -p dist
          cp numerikcloud-infirmiere/app/build/outputs/apk/debug/app-debug.apk dist/NumerikCloud-INF-V2-VisuelsV4.apk
          test -s dist/NumerikCloud-INF-V2-VisuelsV4.apk
      - name: Construire la version parallele sans toucher la V2 installee
        working-directory: numerikcloud-infirmiere
        run: gradle --no-daemon --rerun-tasks --stacktrace -PncParallel=true :app:assembleDebug
      - name: Sauvegarder le deuxieme APK
        run: |
          set -e
          cp numerikcloud-infirmiere/app/build/outputs/apk/debug/app-debug.apk dist/NumerikCloud-INF-V2-VisuelsV4-TEST.apk
          test -s dist/NumerikCloud-INF-V2-VisuelsV4-TEST.apk
      - name: Publier les deux APK
        uses: actions/upload-artifact@v4
        with:
          name: NumerikCloud-INF-V2-Compatibilite-V4
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
