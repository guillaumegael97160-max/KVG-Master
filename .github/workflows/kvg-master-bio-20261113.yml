name: Compiler KVG MASTER Gestion Biometrie
on:
  workflow_dispatch:
  push:
    branches: [kvg-master-bio-20261113]
    paths:
      - 'blackgold-master/**'
      - '.github/workflows/kvg-master-bio-20261113.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode public placeholder assets
        run: |
          python3 -m pip install pillow
          python3 - <<'PY_INNER'
          import base64
          from pathlib import Path
          from PIL import Image, ImageDraw
          base=Path('blackgold-master')
          res=base/'app/src/main/res'
          d=res/'drawable-nodpi'
          d.mkdir(parents=True,exist_ok=True)
          for i in range(6):
              data=base64.b64decode((base/f'assets/intro_{i}.webp.b64').read_text())
              (d/f'intro_{i}.webp').write_bytes(data)
          im=Image.new('RGB',(512,512),'#f7f2e7')
          draw=ImageDraw.Draw(im)
          draw.ellipse((10,10,501,501),outline='#b9914a',width=10)
          draw.text((166,225),'KVG',fill='#164e32')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=res/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              im.resize((size,size),Image.Resampling.LANCZOS).save(folder/'ic_launcher.png')
          PY_INNER
      - name: SDK Android 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK
        run: gradle --no-daemon --stacktrace --project-dir blackgold-master :app:assembleDebug
      - name: Prepare APK and local signing tool
        run: |
          mkdir -p export
          cp blackgold-master/app/build/outputs/apk/debug/app-debug.apk export/kvg_master_base.apk
          find "$ANDROID_HOME/build-tools" -name apksigner.jar -print -quit | xargs -r -I{} cp '{}' export/apksigner.jar
      - name: Artifact APK de base sans photos personnelles
        uses: actions/upload-artifact@v4
        with:
          name: KVG-MASTER-BIOMETRIE-BASE-20261113
          path: export/
          if-no-files-found: error
          retention-days: 7
