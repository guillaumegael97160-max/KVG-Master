name: Notre Famille Guillaume - Android start smoke test
on:
  push:
    branches: [notre-famille-guillaume-android-v5]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android build SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: cd famille-guillaume-android && gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test APK startup in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          script: |
            adb install -r famille-guillaume-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.familleguillaume.application/.MainActivity
            sleep 10
            PID=$(adb shell pidof com.familleguillaume.application | tr -d '\r')
            echo "APP_PID=$PID"
            test -n "$PID"
            adb logcat -d -s AndroidRuntime:E | tee /tmp/famille-android-errors.txt
            ! grep -q "FATAL EXCEPTION" /tmp/famille-android-errors.txt
