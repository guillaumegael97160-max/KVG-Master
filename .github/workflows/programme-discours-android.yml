name: APK Presentoir Pointe d Or Plein Ecran
on:
  push:
    branches:
      - presentoir-pointe-or-fullscreen-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Creer application Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discours-build/app/src/main/java/fr/pointeor/discours
          mkdir -p discours-build/app/src/main/res/drawable
          mkdir -p discours-build/app/src/main/res/values
          cat > discours-build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'ProgrammeDiscours'
          include ':app'
          EOF
          cat > discours-build/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF
          cat > discours-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > discours-build/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'fr.pointeor.discours'; compileSdk 35
          defaultConfig { applicationId 'fr.pointeor.presentoir.fullscreen'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
          compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > discours-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="false" android:usesCleartextTraffic="false" android:icon="@drawable/app_icon" android:label="Présentoir Pointe d’Or" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          printf '%s' '' | base64 -d > discours-build/app/src/main/res/drawable/app_icon.png
          cat > discours-build/app/src/main/java/fr/pointeor/discours/MainActivity.java <<'EOF'
          package fr.pointeor.discours;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          public class MainActivity extends Activity {
           static final String URL="https://script.google.com/macros/s/AKfycbylx016T7zZoWRVgtwMLuo9puOwCrwAAeVUSWAx34mrDBNgQMubaXI9Dq57X1bTBg0WPw/exec";
           WebView web; FrameLayout root; View splash;
           int dp(int v){return (int)(getResources().getDisplayMetrics().density*v);}
           @SuppressWarnings("deprecation") void immersive(){
            int flags=View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE;
            getWindow().getDecorView().setSystemUiVisibility(flags);
            if(Build.VERSION.SDK_INT>=30){android.view.WindowInsetsController c=getWindow().getInsetsController();if(c!=null){c.hide(android.view.WindowInsets.Type.statusBars()|android.view.WindowInsets.Type.navigationBars());c.setSystemBarsBehavior(android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);}}
           }
           @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);immersive();
            root=new FrameLayout(this);web=new WebView(this);root.addView(web,new FrameLayout.LayoutParams(-1,-1));setContentView(root);
            LinearLayout loading=new LinearLayout(this);loading.setGravity(Gravity.CENTER);loading.setOrientation(1);loading.setBackgroundColor(0xff10385e);
            ImageView img=new ImageView(this);img.setImageResource(R.drawable.app_icon);loading.addView(img,new LinearLayout.LayoutParams(dp(130),dp(130)));
            TextView txt=new TextView(this);txt.setText("Présentoir Pointe d’Or");txt.setTextColor(-1);txt.setTextSize(19);txt.setGravity(Gravity.CENTER);loading.addView(txt,new LinearLayout.LayoutParams(-1,dp(65)));
            ProgressBar bar=new ProgressBar(this);loading.addView(bar,new LinearLayout.LayoutParams(dp(45),dp(45)));splash=loading;root.addView(splash,new FrameLayout.LayoutParams(-1,-1));
            WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setUseWideViewPort(true);s.setLoadWithOverviewMode(true);s.setAllowFileAccess(false);s.setAllowContentAccess(false);s.setJavaScriptCanOpenWindowsAutomatically(true);s.setSupportMultipleWindows(true);s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
            CookieManager.getInstance().setAcceptCookie(true);CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
            web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView w,WebResourceRequest r){return route(r.getUrl());}
            @Override public void onPageFinished(WebView w,String u){if(splash!=null){root.removeView(splash);splash=null;}immersive();}
            @Override public void onReceivedError(WebView w,WebResourceRequest req,WebResourceError e){if(req.isForMainFrame()){if(splash!=null){root.removeView(splash);splash=null;}new AlertDialog.Builder(MainActivity.this).setTitle("Connexion indisponible").setMessage("Vérifie ta connexion Internet.").setPositiveButton("Réessayer",(d,i)->web.loadUrl(URL)).setNegativeButton("Fermer",(d,i)->finish()).show();}}});
            web.setWebChromeClient(new WebChromeClient(){@Override public boolean onCreateWindow(WebView source,boolean dialog,boolean gesture,Message msg){
            WebView child=new WebView(MainActivity.this);child.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){if(!route(r.getUrl()))web.loadUrl(r.getUrl().toString());v.destroy();return true;}});
            WebView.WebViewTransport t=(WebView.WebViewTransport)msg.obj;t.setWebView(child);msg.sendToTarget();return true;}});
            web.loadUrl(URL);
           }
           boolean route(Uri u){String scheme=u.getScheme()==null?"":u.getScheme().toLowerCase();String h=u.getHost()==null?"":u.getHost().toLowerCase();
            if("https".equals(scheme)||"http".equals(scheme)){if(h.equals("wa.me")||h.equals("api.whatsapp.com")||h.equals("web.whatsapp.com"))return external(u);return false;}
            if("intent".equals(scheme)){try{startActivity(Intent.parseUri(u.toString(),Intent.URI_INTENT_SCHEME));}catch(Exception ignored){}return true;}
            if(scheme.equals("tel")||scheme.equals("mailto")||scheme.equals("sms")||scheme.equals("whatsapp"))return external(u);return true;
           }
           boolean external(Uri u){try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){new AlertDialog.Builder(this).setMessage("Aucune application disponible pour ouvrir ce lien.").setPositiveButton("OK",null).show();}return true;}
           @Override public void onWindowFocusChanged(boolean x){super.onWindowFocusChanged(x);if(x)immersive();}
           @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else new AlertDialog.Builder(this).setMessage("Fermer Présentoir Pointe d’Or ?").setNegativeButton("Annuler",null).setPositiveButton("Fermer",(d,i)->finish()).show();}
           @Override protected void onDestroy(){if(web!=null){web.stopLoading();web.destroy();web=null;}super.onDestroy();}
          }
          EOF
      - name: Installer SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK
        run: cd discours-build && gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Presentoir-Pointe-Or-PleinEcran-APK
          path: discours-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
