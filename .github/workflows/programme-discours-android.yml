name: Compilation APK Discours Pointe d Or
on:
  push:
    branches:
      - programme-discours-android-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Creer application Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discours-build/app/src/main/java/fr/pointeor/discours
          mkdir -p discours-build/app/src/main/res/drawable
          mkdir -p discours-build/app/src/main/res/values
          cat > discours-build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'ProgrammeDiscours'
          include ':app'
          EOF
          cat > discours-build/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF
          cat > discours-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > discours-build/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'fr.pointeor.discours'; compileSdk 35
          defaultConfig { applicationId 'fr.pointeor.discours.v2'; minSdk 24; targetSdk 34; versionCode 2; versionName '2.0' }
          compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > discours-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="false" android:usesCleartextTraffic="false" android:icon="@drawable/app_icon" android:label="Discours Pointe d’Or" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > discours-build/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#10385E" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#D7A83F" android:pathData="M12,12h84v2h-84z M12,94h84v2h-84z"/>
          <path android:fillColor="#F5D886" android:pathData="M54,22 l2,10 l9,2 l-9,2 l-2,10 l-2,-10 l-9,-2z"/>
          <path android:strokeColor="#E5B84A" android:strokeWidth="3" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M24,53 C35,47 46,50 54,55 C63,50 75,47 84,53 M54,55v24 M24,53v23 C37,72 45,75 54,79 C65,75 75,72 84,76 V53"/>
          <path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M30,59 C38,56 44,57 50,61 M58,61 C65,57 72,56 78,59 M30,65 C38,62 44,64 50,67 M58,67 C65,64 72,62 78,65"/>
          </vector>
          EOF
          cat > discours-build/app/src/main/java/fr/pointeor/discours/MainActivity.java <<'EOF'
          package fr.pointeor.discours;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          
          public class MainActivity extends Activity {
            String url=""; WebView web; LinearLayout screen; boolean desktop=false; String mobileUA="";
            int blue=Color.rgb(20,75,124),gold=Color.rgb(198,151,56);
            int px(int a){return (int)(a*getResources().getDisplayMetrics().density);}
            LinearLayout col(){LinearLayout l=new LinearLayout(this);l.setOrientation(1);return l;}
            GradientDrawable bg(int c){GradientDrawable d=new GradientDrawable();d.setColor(c);d.setCornerRadius(px(12));return d;}
            TextView txt(String s,int size,int c){TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(c);return t;}
            Button btn(String s){Button b=new Button(this);b.setText(s);b.setAllCaps(false);b.setTextColor(-1);b.setBackground(bg(blue));return b;}
            boolean allowed(String u){Uri x=Uri.parse(u);return "https".equals(x.getScheme())&&"script.google.com".equals(x.getHost())&&x.getPath()!=null&&x.getPath().startsWith("/macros/s/")&&x.getPath().endsWith("/exec");}
            void setup(String action,Runnable listener){screen=col();screen.setBackgroundColor(0xfff5f8fc);setContentView(screen);LinearLayout h=new LinearLayout(this);h.setPadding(px(12),px(8),px(12),px(8));h.setBackgroundColor(blue);h.setGravity(Gravity.CENTER_VERTICAL);TextView title=txt("✦ Discours Pointe d’Or",15,-1);h.addView(title,new LinearLayout.LayoutParams(0,px(52),1));Button b=btn(action);h.addView(b,new LinearLayout.LayoutParams(px(105),px(48)));b.setOnClickListener(v->listener.run());screen.addView(h);}
            @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(blue);url=getPreferences(0).getString("url","https://script.google.com/macros/s/AKfycbylx016T7zZoWRVgtwMLuo9puOwCrwAAeVUSWAx34mrDBNgQMubaXI9Dq57X1bTBg0WPw/exec");desktop=getPreferences(0).getBoolean("desktop",false);if(allowed(url))site();else config();}
            void config(){if(web!=null){web.destroy();web=null;}setup("Fermer",()->{if(allowed(url))site();});ScrollView scroll=new ScrollView(this);screen.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));LinearLayout content=col();content.setPadding(px(24),px(30),px(24),px(24));scroll.addView(content);ImageView icon=new ImageView(this);icon.setImageResource(R.drawable.app_icon);content.addView(icon,new LinearLayout.LayoutParams(px(110),px(110)));TextView t=txt("Programme des discours\nPointe d’Or",24,blue);t.setGravity(Gravity.CENTER);content.addView(t);TextView info=txt("\nColle le lien de ton site Google Apps Script Programme de discours. Il se termine par /exec. L'adresse sera mémorisée.",15,Color.DKGRAY);content.addView(info);EditText input=new EditText(this);input.setSingleLine(true);input.setText(url);input.setHint("https://script.google.com/macros/s/…/exec");input.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_URI);content.addView(input,new LinearLayout.LayoutParams(-1,px(72)));Button go=btn("Enregistrer et ouvrir");content.addView(go,new LinearLayout.LayoutParams(-1,px(58)));go.setOnClickListener(v->{String u=input.getText().toString().trim();if(!allowed(u)){Toast.makeText(this,"Adresse /exec invalide",1).show();return;}url=u;getPreferences(0).edit().putString("url",url).apply();site();});content.addView(txt("\nLe code d’accès des anciens est géré directement par ton site.",13,Color.GRAY));}
            boolean external(Uri uri){String host=uri.getHost()==null?"":uri.getHost().toLowerCase();String sc=uri.getScheme()==null?"":uri.getScheme();if(sc.equals("https")&&(host.equals("script.google.com")||host.endsWith("googleusercontent.com")))return false;try{startActivity(new Intent(Intent.ACTION_VIEW,uri));}catch(Exception e){Toast.makeText(this,"Impossible d’ouvrir ce lien",1).show();}return true;}
            
            void useMode(){if(web==null)return;web.getSettings().setUseWideViewPort(true);web.getSettings().setLoadWithOverviewMode(true);if(mobileUA.isEmpty())mobileUA=web.getSettings().getUserAgentString();}
            void modeScript(){if(web==null)return;String js=desktop?"(function(){var m=document.querySelector('meta[name=viewport]');if(m)m.setAttribute('content','width=1280,initial-scale=1');if(document.body){document.body.classList.add('pd-forced-desktop');document.body.classList.remove('pd-forced-mobile');}var b=document.querySelector('.topactions button[onclick*=\\\"location.reload\\\"]');if(b)b.style.display='none';})();":"(function(){var m=document.querySelector('meta[name=viewport]');if(m)m.setAttribute('content','width=device-width,initial-scale=1');if(document.body){document.body.classList.remove('pd-forced-desktop');document.body.classList.add('pd-forced-mobile');}var b=document.querySelector('.topactions button[onclick*=\\\"location.reload\\\"]');if(b)b.style.display='none';})();";web.evaluateJavascript(js,null);}
            void toggleMode(){desktop=!desktop;getPreferences(0).edit().putBoolean("desktop",desktop).apply();if(web!=null){modeScript();}siteModeLabel();}
            void siteModeLabel(){if(screen==null||screen.getChildCount()==0)return;View h=screen.getChildAt(0);if(h instanceof LinearLayout){LinearLayout row=(LinearLayout)h;if(row.getChildCount()>=2&&row.getChildAt(1) instanceof Button){((Button)row.getChildAt(1)).setText(desktop?"▯ Téléphone":"▣ Ordinateur");}}}
          
            void site(){if(web!=null){web.destroy();web=null;}setup(desktop?"▯ Téléphone":"▣ Ordinateur",()->toggleMode());LinearLayout bar=(LinearLayout)screen.getChildAt(0);Button settings=btn("⚙");bar.addView(settings,new LinearLayout.LayoutParams(px(42),px(48)));settings.setOnClickListener(v->config());FrameLayout frame=new FrameLayout(this);screen.addView(frame,new LinearLayout.LayoutParams(-1,0,1));web=new WebView(this);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setDomStorageEnabled(true);web.getSettings().setAllowFileAccess(false);useMode();CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);frame.addView(web,new FrameLayout.LayoutParams(-1,-1));ProgressBar p=new ProgressBar(this);FrameLayout.LayoutParams fp=new FrameLayout.LayoutParams(px(48),px(48),Gravity.CENTER);frame.addView(p,fp);web.setWebChromeClient(new WebChromeClient());web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return external(r.getUrl());}@Override public void onPageFinished(WebView v,String u){p.setVisibility(View.GONE);modeScript();}@Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame())Toast.makeText(MainActivity.this,"Vérifie la connexion Internet.",1).show();}});web.loadUrl(url);}
            @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else if(web!=null)config();else super.onBackPressed();}
          }
          EOF
      - name: Installer SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK
        run: cd discours-build && gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Programme-Discours-Pointe-Or-APK
          path: discours-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
