name: KVG Lab Master - APK Android

on:
  push:
    branches: [main]
    paths:
      - 'lab-master/**'
      - '.github/workflows/kvg-lab-master.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lab-master:
    name: Compiler KVG Lab Master
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Python Pillow
        run: python3 -m pip install --user pillow
      - name: Construire le projet Android independant
        run: python3 lab-master/build-lab-master.py
      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm /111 -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager introuvable"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDK_STATUS" -ne 0 ]; then exit "$SDK_STATUS"; fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK KVG Lab Master
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verifier et renommer
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KVG-Lab-Master.apk
      - name: Publier fichier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: KVG-Lab-Master-APK
          path: dist/KVG-Lab-Master.apk
          if-no-files-found: error
          retention-days: 30
