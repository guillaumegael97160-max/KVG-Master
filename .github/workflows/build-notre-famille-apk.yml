name: Notre Famille Guillaume - Android APK
on:
  push:
    branches: [notre-famille-guillaume-android-v5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and tools
        run: |
          echo 'y' | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build real Android APK
        run: cd famille-guillaume-android && gradle assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Notre_Famille_Guillaume_V5_APK
          path: famille-guillaume-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
