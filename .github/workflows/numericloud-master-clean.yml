name: NumerikCloud MASTER - Android APK
on:
  push:
    branches: [numericloud-master-clean-2026]
    paths:
      - 'numerikcloud-infirmiere/**'
      - '.github/workflows/numericloud-master-clean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler l'APK NumerikCloud MASTER
        working-directory: numerikcloud-infirmiere
        run: gradle --no-daemon assembleDebug
      - name: Publier l'APK MASTER
        uses: actions/upload-artifact@v4
        with:
          name: NumerikCloud-MASTER-APK-SANS-KVG
          path: numerikcloud-infirmiere/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
