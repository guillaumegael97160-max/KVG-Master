name: Compiler APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Créer l'APK installable
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler l'APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Vérifier l'APK produit
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Mettre l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: La-Rentree-Mon-Deo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
